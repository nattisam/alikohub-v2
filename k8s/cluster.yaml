apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: alikohub-cluster
  region: us-east-1

managedNodeGroups:
  - name: ng-alikohub
    instanceType: t3.medium
    minSize: 2
    maxSize: 3
    desiredCapacity: 2
    volumeSize: 20
    ssh:
      allow: false
    # IAM policies for EBS PVC support
    iam:
      withAddonPolicies:
        ebs: true

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver # Essential for PVC/Postgres storage
