# Con-Tech Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contech-service
  namespace: alikohub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contech-service
  template:
    metadata:
      labels:
        app: contech-service
    spec:
      containers:
      - name: contech-service
        image: alikohub-contech:latest
        ports:
        - containerPort: 3002
        env:
        - name: AUTH_SERVICE_HOST
          value: "auth-service"
        - name: AUTH_SERVICE_PORT
          value: "3001"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: alikohub-secrets
              key: contech-db-url
---
apiVersion: v1
kind: Service
metadata:
  name: contech-service
  namespace: alikohub
spec:
  selector:
    app: contech-service
  ports:
    - protocol: TCP
      port: 3002
      targetPort: 3002

