apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: alikohub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: alikohub-auth-service:latest
        ports:
        - containerPort: 3001
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: alikohub-secrets
              key: auth-db-url
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: alikohub
spec:
  selector:
    app: auth-service
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
