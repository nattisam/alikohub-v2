apiVersion: v1
kind: Secret
metadata:
  name: alikohub-secrets
  namespace: alikohub
type: Opaque
stringData:
  # Database Credentials
  db-user: "myuser"
  db-password: "mypassword"
  
  # Connection Strings (Internal Cluster DNS)
  # Format: postgresql://user:password@service-name.namespace:5432/dbname
  auth-db-url: "postgresql://myuser:mypassword@postgres.alikohub.svc.cluster.local:5432/alikohub_db"
  academy-db-url: "postgresql://myuser:mypassword@postgres.alikohub.svc.cluster.local:5432/alikohub_db"
  contech-db-url: "postgresql://myuser:mypassword@postgres.alikohub.svc.cluster.local:5432/alikohub_db"
  events-db-url: "postgresql://myuser:mypassword@postgres.alikohub.svc.cluster.local:5432/alikohub_db"
  careers-db-url: "postgresql://myuser:mypassword@postgres.alikohub.svc.cluster.local:5432/alikohub_db"
  
  # JWT Secrets (Placeholders - update in production)
  jwt-secret: "super-secret-jwt-key"
