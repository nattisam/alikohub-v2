apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: alikohub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: 500234530871.dkr.ecr.us-east-1.amazonaws.com/alikohub-api-gateway:latest
        ports:
        - containerPort: 3006
        env:
        - name: AUTH_SERVICE_HOST
          value: "auth-service"
        - name: AUTH_SERVICE_PORT
          value: "3001"
        - name: ACADEMY_SERVICE_HOST
          value: "academy-service"
        - name: ACADEMY_SERVICE_PORT
          value: "3005"
        - name: CONTECH_SERVICE_HOST
          value: "contech-service"
        - name: CONTECH_SERVICE_PORT
          value: "3002"
        - name: EVENTS_SERVICE_HOST
          value: "events-service"
        - name: EVENTS_SERVICE_PORT
          value: "3004"
        - name: CAREERS_SERVICE_HOST
          value: "careers-service"
        - name: CAREERS_SERVICE_PORT
          value: "3008"
        - name: PORT
          value: "3006"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: alikohub
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 3006
      targetPort: 3006
