# ============================================
# AlikoHub Docker Compose - VPS Production
# ============================================
# Domain: api.consultancy.alikohub.com
# Usage: docker-compose -f docker-compose.vps.yml up -d --build

version: '3.8'

services:
  # ============================================
  # Infrastructure Services
  # ============================================
  
  postgres:
    image: postgres:15-alpine
    container_name: alikohub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-alikohub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecurePassword123!}
      POSTGRES_DB: ${DB_NAME:-alikohub_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-alikohub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alikohub-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: alikohub-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alikohub-network

  # ============================================
  # Application Services
  # ============================================

  api-gateway:
    build:
      context: ./domains/core-platform-services/api-gateway-service
      dockerfile: Dockerfile
    container_name: alikohub-api-gateway
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=production
      - PORT=3006
      - AUTH_SERVICE_HOST=auth-service
      - AUTH_SERVICE_PORT=3001
      - AUTH_TCP_PORT=3011
      - ACADEMY_SERVICE_HOST=academy-service
      - ACADEMY_SERVICE_PORT=3005
      - CONTECH_SERVICE_HOST=con-tech-service
      - CONTECH_SERVICE_PORT=3002
      - EVENTS_SERVICE_HOST=events-service
      - EVENTS_SERVICE_PORT=3004
      - CAREERS_SERVICE_HOST=careers-service
      - CAREERS_SERVICE_PORT=3008
      - CONSULTANCY_SERVICE_HOST=consultancy-service
      - CONSULTANCY_SERVICE_PORT=3006
      - FILE_UPLOAD_SERVICE_HOST=file-upload-service
      - FILE_UPLOAD_SERVICE_PORT=3009
      - HOME_SERVICE_HOST=home-service
      - HOME_SERVICE_PORT=3010
      - PAYMENT_SERVICE_HOST=payment-service
      - PAYMENT_SERVICE_PORT=3012
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY:-6LdnZEMsAAAAAMahTcQqDzW0cC7VxzpiuDpyf3Jx}
    depends_on:
      auth-service:
        condition: service_healthy
    networks:
      - alikohub-network

  auth-service:
    build:
      context: ./domains/core-platform-services/auth-service
      dockerfile: Dockerfile
    container_name: alikohub-auth-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - AUTH_SERVICE_PORT=3001
      - AUTH_TCP_PORT=3011
      - DATABASE_URL=postgresql://${DB_USER:-alikohub}:${DB_PASSWORD:-SecurePassword123!}@postgres:5432/${DB_NAME:-alikohub_db}?schema=auth
      - JWT_SECRET=${JWT_SECRET:-changeme}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      - RABBITMQ_ENABLED=true
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - CONTECH_ADMIN_EMAIL=${CONTECH_ADMIN_EMAIL}
      - FIREBASE_SERVICE_ACCOUNT_PATH=/usr/src/app/firebase-service-account.json
    volumes:
      - ./firebase-service-account.json:/usr/src/app/firebase-service-account.json
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - alikohub-network

  academy-service:
    build:
      context: ./domains/academy/backend
      dockerfile: Dockerfile
    container_name: alikohub-academy-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3005
      - DATABASE_URL=postgresql://${DB_USER:-alikohub}:${DB_PASSWORD:-SecurePassword123!}@postgres:5432/${DB_NAME:-alikohub_db}?schema=academy
      - AUTH_SERVICE_HOST=auth-service
      - AUTH_SERVICE_PORT=3001
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      - RABBITMQ_ENABLED=true
      - PAYMENT_SERVICE_HOST=payment-service
      - PAYMENT_SERVICE_PORT=3012
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - alikohub-network

  con-tech-service:
    build:
      context: ./domains/con-tech/backend
      dockerfile: Dockerfile
    container_name: alikohub-con-tech-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=postgresql://${DB_USER:-alikohub}:${DB_PASSWORD:-SecurePassword123!}@postgres:5432/${DB_NAME:-alikohub_db}?schema=contech
      - AUTH_SERVICE_HOST=auth-service
      - AUTH_SERVICE_PORT=3001
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      - RABBITMQ_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - alikohub-network

  events-service:
    build:
      context: ./domains/events/backend
      dockerfile: Dockerfile
    container_name: alikohub-events-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - EVENTS_SERVICE_PORT=3004
      - DATABASE_URL=postgresql://${DB_USER:-alikohub}:${DB_PASSWORD:-SecurePassword123!}@postgres:5432/${DB_NAME:-alikohub_db}?schema=events
      - AUTH_SERVICE_HOST=auth-service
      - AUTH_SERVICE_PORT=3001
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      - RABBITMQ_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - alikohub-network

  careers-service:
    build:
      context: ./domains/core-platform-services/careers-service
      dockerfile: Dockerfile
    container_name: alikohub-careers-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - CAREERS_SERVICE_PORT=3008
      - DATABASE_URL=postgresql://${DB_USER:-alikohub}:${DB_PASSWORD:-SecurePassword123!}@postgres:5432/${DB_NAME:-alikohub_db}?schema=careers
      - AUTH_SERVICE_HOST=auth-service
      - AUTH_SERVICE_PORT=3001
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - alikohub-network

  file-upload-service:
    build:
      context: ./domains/core-platform-services/file-upload-service
      dockerfile: Dockerfile
    container_name: alikohub-file-upload-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3009
      - UPLOAD_PATH=/app/uploads
      - HOST_URL=http://116.203.122.210:3006
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3009/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - alikohub-network

  payment-service:
    build:
      context: ./domains/core-platform-services/payment-service
      dockerfile: Dockerfile
    container_name: alikohub-payment-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PAYMENT_SERVICE_PORT=3012
      - DATABASE_URL=postgresql://${DB_USER:-alikohub}:${DB_PASSWORD:-SecurePassword123!}@postgres:5432/${DB_NAME:-alikohub_db}?schema=payment
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      - RABBITMQ_ENABLED=true
      - AUTH_SERVICE_HOST=auth-service
      - AUTH_SERVICE_PORT=3001
      - CHAPA_KEY=${CHAPA_KEY}
      - CHAPA_SECRET=${CHAPA_SECRET}
      - CHAPA_WEBHOOK_SECRET_HASH=${CHAPA_WEBHOOK_SECRET_HASH}
      - CHAPA_PLATFORM_FEE_PERCENTAGE=${CHAPA_PLATFORM_FEE_PERCENTAGE}
      - PAYMENT_GATEWAY=${PAYMENT_GATEWAY}
      - STRIPE_KEY=${STRIPE_KEY}
      - STRIPE_SECRET=${STRIPE_SECRET}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_SUCCESS_URL=${STRIPE_SUCCESS_URL:-http://localhost:3000/payment/success}
      - STRIPE_CANCEL_URL=${STRIPE_CANCEL_URL:-http://localhost:3000/payment/cancel}
      - CHAPA_CALLBACK_URL=${CHAPA_CALLBACK_URL:-http://api.consultancy.alikohub.com:3006/payments/webhooks/chapa}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4012/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - alikohub-network

  consultancy-service:
    build:
      context: ./domains/consultancy/backend
      dockerfile: Dockerfile
    container_name: alikohub-consultancy-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3006
      - DATABASE_URL=postgresql://${DB_USER:-alikohub}:${DB_PASSWORD:-SecurePassword123!}@postgres:5432/${DB_NAME:-alikohub_db}?schema=consultancy
      - AUTH_SERVICE_HOST=auth-service
      - AUTH_SERVICE_PORT=3001
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      - RABBITMQ_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4006/api/consultancy/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - alikohub-network

  home-service:
    build:
      context: ./domains/Home/backend
      dockerfile: Dockerfile
    container_name: alikohub-home-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3010
      - AUTH_SERVICE_HOST=auth-service
      - AUTH_SERVICE_PORT=3001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - alikohub-network

  home-frontend:
    build:
      context: ./domains/Home/frontend
      dockerfile: Dockerfile
    container_name: alikohub-home-frontend
    ports:
      - "3000:80"
    networks:
      - alikohub-network

# ============================================
# Networks
# ============================================
networks:
  alikohub-network:
    driver: bridge

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  uploads_data:
    driver: local
