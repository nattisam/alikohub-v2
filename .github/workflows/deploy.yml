name: Deploy to cPanel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      # Example: Build API Gateway. Repeat for other services or use nx run-many
      - name: Build API Gateway
        run: npx nx build api-gateway-service

      - name: Build File Upload Service
        run: npx nx build file-upload-service
      
      # Add other build steps as needed...

      - name: Deploy to cPanel via Rsync
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.CPANEL_PORT }}
          source: "dist/,package.json,package-lock.json"
          target: "~/public_html/api-backend" # Customize this path
          strip_components: 0

      - name: Install Production Deps & Restart on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.CPANEL_PORT }}
          script: |
            cd ~/public_html/api-backend
            npm install --production
            # Restart via PM2 or touch tmp/restart.txt if using cPanel Node App
            # pm2 restart ecosystem.config.js
            mkdir -p tmp
            touch tmp/restart.txt
