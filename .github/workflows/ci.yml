name: Monorepo CI

on:
  push:
    branches: [ main, from-vps ]
  pull_request:
    branches: [ main, from-vps ]

jobs:
  validate:
    name: Validate Services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - path: domains/academy/backend
            name: academy-service
          - path: domains/con-tech/backend
            name: con-tech-service
          - path: domains/core-platform-services/api-gateway-service
            name: api-gateway
          - path: domains/core-platform-services/auth-service
            name: auth-service
          - path: domains/core-platform-services/careers-service
            name: careers-service
          - path: domains/core-platform-services/file-upload-service
            name: file-upload-service
          - path: domains/events/backend
            name: events-service
          - path: domains/Home/backend
            name: home-service
          - path: domains/Home/frontend
            name: home-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install
        working-directory: ${{ matrix.service.path }}

      - name: Prisma Generate (if exists)
        run: |
          if [ -d "prisma" ]; then
            npx prisma generate
          fi
        working-directory: ${{ matrix.service.path }}

      - name: Lint
        run: npm run lint --if-present
        working-directory: ${{ matrix.service.path }}

      - name: Build
        run: npm run build
        working-directory: ${{ matrix.service.path }}

      - name: Test
        run: npm run test --if-present
        working-directory: ${{ matrix.service.path }}
