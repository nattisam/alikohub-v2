<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- App Identity -->
    <title>Aliko Hub LMS</title>
    <meta
      name="description"
      content="Aliko Hub Learning Management System for course access, instructor-led cohorts, and student progress tracking."
    />
    <meta name="application-name" content="Aliko Hub LMS" />
    <meta name="author" content="Aliko Hub" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/AlikoLogo.svg" />

    <!-- Theme / UI -->
    <meta name="theme-color" content="#0f172a" />
    <!-- slate-900 -->
    <meta name="color-scheme" content="light dark" />

    <!-- App Behavior -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- not for SEO -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Mobile / PWA feel -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Montserrat:wght@100;300;400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph (minimal, internal use safe) -->
    <meta property="og:title" content="Aliko Hub LMS" />
    <meta
      property="og:description"
      content="Internal learning platform for managing courses, cohorts, and progress."
    />
    <meta property="og:type" content="website" />

    <!-- Security (basic) -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
