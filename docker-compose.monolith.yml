services:
  alikohub-monolith:
    build:
      context: .
      dockerfile: Dockerfile.monolith
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
      - "3004:3004"
      - "3005:3005"
      - "3006:3006"
      - "3008:3008"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://myuser:mypassword@postgres:5432/alikohub_db
      
      # Internal Service Discovery (All on localhost inside this container)
      - AUTH_SERVICE_HOST=localhost
      - AUTH_SERVICE_PORT=3001
      - ACADEMY_SERVICE_HOST=localhost
      - ACADEMY_SERVICE_PORT=3005
      - CONTECH_SERVICE_HOST=localhost
      - CONTECH_SERVICE_PORT=3002
      - EVENTS_SERVICE_HOST=localhost
      - EVENTS_SERVICE_PORT=3004
      - CAREERS_SERVICE_HOST=localhost
      - CAREERS_SERVICE_PORT=3008
      
      # Ports for individual services (if they rely on env vars)
      - AUTH_SERVICE_PORT=3001
      - ACADEMY_SERVICE_PORT=3005
      - CONTECH_SERVICE_PORT=3002
      - EVENTS_SERVICE_PORT=3004
      - CAREERS_SERVICE_PORT=3008
      - PORT=3006
    depends_on:
      - postgres

  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: alikohub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
